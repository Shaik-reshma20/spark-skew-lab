[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-skew-lab"
version = "0.1.0"
description = "Reproducible PySpark skew benchmark and data quality pipeline"
requires-python = ">=3.10,<3.13"
dependencies = ["pyspark==3.5.5"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
